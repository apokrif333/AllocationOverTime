[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-allocation"
version = "1.0.0"
description = "Auditable historical-cost portfolio allocation from an IBKR Excel audit"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4", "plotly>=7.1,<8"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
portfolio-allocation = "portfolio_allocation.__main__:main"

[tool.setuptools.packages.find]
include = ["portfolio_allocation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
